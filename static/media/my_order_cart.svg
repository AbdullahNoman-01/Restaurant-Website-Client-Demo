    <!-- Right side rail -->
    <path d="M39 10L36 29" stroke="#DFC088" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Back basket / cart support -->
    <path d="M15 10H43" stroke="#DFC088" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- Food Cloche Tray Base -->
    <rect x="17" y="17.5" width="24" height="6.5" rx="1.8" fill="#DFC088" stroke="#070908" stroke-width="0.8"/>
    
    <!-- Food Cloche Dome -->
    <path d="M19 17.5C19 10 24 6 29 6C34 6 39 10 39 17.5H19Z" fill="#DFC088"/>
    
    <!-- Top knob / handle of dome -->
    <ellipse cx="29" cy="4.2" rx="2" ry="1.6" fill="#DFC088"/>
    <path d="M29 5.8V6" stroke="#DFC088" stroke-width="1.8"/>
    
    <!-- Dome Shine / Highlight -->
    <path d="M23 11.5C24.5 9 26.5 8 27.5 8" stroke="#070908" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Lower shelf / wheel support -->
