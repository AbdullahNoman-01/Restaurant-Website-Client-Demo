    <!-- Left Wheel -->
    <circle cx="19" cy="34" r="3.2" fill="#DFC088"/>
    <circle cx="19" cy="34" r="1.3" fill="#070908"/>
    
    <!-- Right Wheel -->
    <circle cx="34" cy="34" r="3.2" fill="#DFC088"/>
    <circle cx="34" cy="34" r="1.3" fill="#070908"/>
</svg>